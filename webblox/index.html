<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roblox</title>
  <link rel="stylesheet" href="host.css">
</head>
<body>
  <!-- Every id below is looked up by Roblox's WasmPlayer.js: the IME inputs, the
       canvas, the loading screen and the two hidden debug spans. -->
  <div id="input-container">
    <textarea id="input-textarea" autocapitalize="off"></textarea>
    <input id="input-input" autocapitalize="off">
  </div>
  <canvas id="canvas" tabindex="-1"></canvas>
  <div id="loading-overlay" role="dialog" aria-label="Loading Roblox" aria-busy="true">
    <img id="loading-background-image" alt="" crossorigin="anonymous">
    <section class="loading-card" aria-labelledby="loading-experience-title">
      <div id="loading-icon-shell"><img id="loading-experience-icon" alt="" crossorigin="anonymous"></div>
      <h1 id="loading-experience-title">Roblox</h1>
      <p class="loading-creator">
        <span id="loading-experience-creator" hidden></span>
        <span id="loading-verified-badge" role="img" aria-label="Verified creator" hidden></span>
      </p>
      <p id="status" role="status" aria-live="polite">Iniciando…</p>
    </section>
    <section class="loading-error-panel" role="alertdialog" aria-labelledby="loading-error-title" aria-describedby="loading-error-message loading-error-code" hidden>
      <h1 id="loading-error-title">Join Error</h1>
      <p id="loading-error-message"></p>
      <p id="loading-error-code"></p>
      <button id="loading-error-leave" type="button">Leave</button>
    </section>
    <button id="loading-cancel" type="button" aria-label="Cancel loading" title="Cancel">×</button>
  </div>
  <div hidden><span id="server"></span><span id="proxyenabled"></span></div>
  <!-- Runs first, in syntax any Chrome understands, so an old browser gets a
       clear answer instead of an engine that fails halfway. host.js reads
       window.__bloxCompat. -->
  <script>
    (function () {
      var problems = [];
      var ua = navigator.userAgent;
      var match = /Chrom(?:e|ium)\/(\d+)/.exec(ua);
      var chrome = match ? Number(match[1]) : 0;
      var wasm = typeof WebAssembly === "object";
      if (!("serviceWorker" in navigator)) problems.push("service workers");
      if (!window.crossOriginIsolated || typeof SharedArrayBuffer !== "function") problems.push("memoria compartida (SharedArrayBuffer)");
      if (!wasm) problems.push("WebAssembly");
      else if (typeof WebAssembly.Suspending !== "function" || typeof WebAssembly.promising !== "function") problems.push("JSPI de WebAssembly");
      var webgl2 = false;
      try { webgl2 = !!document.createElement("canvas").getContext("webgl2"); } catch (e) {}
      if (!webgl2 && !navigator.gpu) problems.push("WebGL 2 o WebGPU");
      if (typeof WebTransport !== "function") problems.push("WebTransport");
      var advice;
      if (chrome && chrome < 123) advice = "Tienes Chrome " + chrome + ". El motor de Roblox necesita Chrome 137 o posterior: actualízalo en chrome://settings/help.";
      else if (chrome && chrome < 137) advice = "Tienes Chrome " + chrome + ". Actualízalo a la versión 137 o posterior en chrome://settings/help, o activa \"Experimental WebAssembly JavaScript Promise Integration (JSPI)\" en chrome://flags y reinicia el navegador.";
      else advice = "Usa una versión reciente de Chrome o Edge (137 o posterior).";
      window.__bloxCompat = {
        ok: problems.length === 0,
        problems: problems,
        message: problems.length ? "Este navegador no puede ejecutar el motor de Roblox: le falta " + problems.join(", ") + ". " + advice : ""
      };
    })();
  </script>
  <script type="module" src="host.js"></script>
</body>
</html>
